<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#15161c">
<title>耳コピ図鑑</title>
<style>
:root{--bg:#15161c;--panel:#1f2129;--line:#2e313c;--fg:#e9e9ef;--mute:#8a8c99;--acc:#ffb84d;--acc2:#5ec4ff;--white:#f4f1ea;--black:#23242c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;overscroll-behavior:none}
#app{position:fixed;inset:0}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.hidden{display:none!important}
.bar{display:flex;align-items:center;gap:8px;padding:8px 12px;min-height:52px}
.bar h1{font-size:18px;margin:0}
.spacer{flex:1}
button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:15px;cursor:pointer;touch-action:manipulation}
button.ghost{background:transparent;border-color:transparent;color:var(--mute)}
button.primary{background:var(--acc);color:#1b1206;border-color:transparent;font-weight:600}
button.danger{color:#ff7b7b}
#title{flex:1;min-width:0;font:inherit;font-size:17px;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--fg);padding:6px 2px;outline:none}
.keybadge{background:var(--panel);border-radius:999px;padding:6px 12px;font-weight:600;white-space:nowrap;touch-action:none;user-select:none;-webkit-user-select:none;cursor:ns-resize;transition:transform .08s}
.keybadge.drag{border-color:var(--acc2);color:var(--acc2)}
.keybadge.tick{transform:scale(1.12)}
.keybadge.unset{color:var(--acc);border-color:var(--acc)}
.hint{padding:2px 14px 8px;font-size:13px;color:var(--mute);min-height:24px;line-height:1.4}
.hint.keymode{color:var(--acc)}
.score{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 12px;position:relative}
#score{flex:1;width:100%;resize:none;font:inherit;font-size:22px;line-height:1.6;letter-spacing:.04em;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none}
#score:focus{border-color:#4a4e5e}
#score::placeholder{color:#555968;font-size:16px}
.now{position:absolute;right:26px;bottom:10px;font-size:40px;font-weight:700;color:var(--acc);pointer-events:none;opacity:0;transition:opacity .5s;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.now.show{opacity:1;transition:none}
.controls{display:flex;gap:6px;padding:10px 12px}
.controls button{flex:1;padding:12px 6px;font-size:16px}
.controls .ghost{flex:0 0 auto}
.controls button.on{color:var(--acc2)}
.piano-wrap{height:42%;max-height:380px;overflow-x:auto;overflow-y:hidden;touch-action:pan-x;background:#0d0e12;padding-bottom:env(safe-area-inset-bottom);scrollbar-width:none}
.piano-wrap::-webkit-scrollbar{display:none}
.piano{position:relative;height:100%}
.key{position:absolute;top:0;display:flex;align-items:flex-end;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:pan-x}
.key.white{width:46px;height:100%;background:var(--white);border:1px solid #c9c4b8;border-radius:0 0 6px 6px;color:#3a3a3a;z-index:1;padding-bottom:12px}
.key.black{width:30px;height:60%;background:var(--black);border:1px solid #000;border-radius:0 0 5px 5px;color:#ddd;z-index:2;padding-bottom:8px}
.key .lbl{font-size:14px;font-weight:600;line-height:1;white-space:nowrap}
.key .lbl .oct{font-size:11px;color:#c0392b;margin-left:1px}
.key.black .lbl .oct{color:#ff9f8a}
.key.black .lbl{font-size:12px}
.key .sub{position:absolute;top:6px;font-size:10px;color:#999;font-weight:400}
.key.tonic.white{background:#ffe6b3}
.key.tonic.black{background:#4a3a1a}
.key.down.white{background:#ffd27a!important}
.key.down.black{background:#7a5a1f!important}
.key.commit{outline:3px solid var(--acc2);outline-offset:-3px}
.key.lit.white{background:#9fdcff!important}
.key.lit.black{background:#2f7ea8!important}
.list{flex:1;overflow:auto;padding:0 12px 100px}
.item{background:var(--panel);border-radius:12px;padding:12px 14px;margin-bottom:10px;display:flex;gap:12px;align-items:center;cursor:pointer}
.item .body{flex:1;min-width:0}
.item .t{font-weight:600;font-size:16px}
.item .p{color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.item .k{font-size:13px;color:var(--acc);font-weight:600;white-space:nowrap}
.empty{color:var(--mute);text-align:center;padding:60px 20px;line-height:1.8}
.fab{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom));padding:14px 26px;font-size:17px;border-radius:999px;box-shadow:0 6px 24px rgba(0,0,0,.5)}
dialog{background:var(--panel);color:var(--fg);border:0;border-radius:14px;padding:16px;width:min(92vw,480px);max-height:90vh}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog h2{margin:0 0 10px;font-size:16px}
dialog textarea{width:100%;height:40vh;font:inherit;font-size:15px;line-height:1.5;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px;resize:none}
dialog p{color:var(--mute);font-size:13px;margin:0 0 8px;line-height:1.5}
.row{display:flex;gap:8px;align-items:center;margin-top:10px}
.menu button{display:block;width:100%;text-align:left;margin-bottom:8px}
.toast{position:absolute;left:50%;bottom:48%;transform:translateX(-50%);background:#000c;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <section id="screen-list" class="screen">
    <header class="bar">
      <h1>耳コピ図鑑</h1>
      <div class="spacer"></div>
      <button id="btn-import" class="ghost">取り込み</button>
      <button id="btn-export-all" class="ghost">書き出し</button>
    </header>
    <div id="song-list" class="list"></div>
    <button id="btn-new" class="fab primary">＋ 新しい曲</button>
  </section>

  <section id="screen-edit" class="screen hidden">
    <header class="bar">
      <button id="btn-back" class="ghost">‹ 図鑑</button>
      <input id="title" placeholder="タイトル" autocomplete="off" enterkeyhint="done">
      <button id="btn-key" class="keybadge unset">キー ?</button>
      <button id="btn-menu" class="ghost">⋯</button>
    </header>
    <div id="hint" class="hint"></div>
    <div class="score">
      <textarea id="score" inputmode="none" spellcheck="false" autocomplete="off" autocorrect="off" placeholder="鍵盤を下にスワイプすると音が入ります"></textarea>
      <div id="now" class="now"></div>
    </div>
    <div class="controls">
      <button id="btn-play" class="primary">▶ 再生</button>
      <button id="btn-stop" class="ghost">■</button>
      <button id="btn-space">␣</button>
      <button id="btn-newline">↵</button>
      <button id="btn-bs">⌫</button>
      <button id="btn-kbd" class="ghost" title="キーボードで編集">⌨</button>
    </div>
    <div class="piano-wrap" id="piano-wrap"><div id="piano" class="piano"></div></div>
  </section>

  <dialog id="dlg-text">
    <h2 id="dlg-title"></h2>
    <p id="dlg-desc"></p>
    <textarea id="dlg-ta"></textarea>
    <div class="row">
      <button id="dlg-copy" class="ghost">コピー</button>
      <div class="spacer"></div>
      <button id="dlg-cancel" class="ghost">閉じる</button>
      <button id="dlg-ok" class="primary">取り込む</button>
    </div>
  </dialog>

  <dialog id="dlg-menu" class="menu">
    <button id="m-export">テキストで書き出し</button>
    <button id="m-share">共有リンクをコピー</button>
    <button id="m-delete" class="danger">この曲を削除</button>
    <button id="m-close" class="ghost">閉じる</button>
  </dialog>

  <div id="toast" class="toast"></div>
</div>

<script>
'use strict';
// ---------- 定数 ----------
const SOLF = ['ド','デ','レ','リ','ミ','ファ','フィ','ソ','サ','ラ','チ','シ'];
const NOTE = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const BLACK = new Set([1,3,6,8,10]);
const LOW = 48, HIGH = 95;          // C3..B6
const WHITE_W = 46, BLACK_W = 30;
const BEAT = 0.38;
const SWIPE_PX = 36;
const UP = '↑', DOWN = '↓';   // オクターブ記号（基準のド〜シは無印）
const UP_CHARS = new Set(['↑','^','＾']), DOWN_CHARS = new Set(['↓','_','＿']);
const LS_SONGS = 'mimizukan.songs', LS_LAST = 'mimizukan.last';

const $ = id => document.getElementById(id);
const screenList = $('screen-list'), screenEdit = $('screen-edit');
const ta = $('score'), titleEl = $('title'), hintEl = $('hint'), nowEl = $('now');
const piano = $('piano'), pianoWrap = $('piano-wrap'), keyBtn = $('btn-key');

// ---------- 状態 ----------
let songs = load(LS_SONGS, []);
let song = null;                    // 編集中
let mode = 'key';                   // 'key' | 'melody'
let tonicPc = null;

function load(k, d){ try { const v = localStorage.getItem(k); return v==null ? d : JSON.parse(v); } catch(e){ return d; } }
function save(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

// ---------- 音 ----------
let ctx = null, master = null;
const voices = new Set();
let playGen = 0, playing = false;
function audio(){
  if (!ctx) { ctx = new (window.AudioContext||window.webkitAudioContext)(); master = ctx.createGain(); master.gain.value = 0.8; master.connect(ctx.destination); }
  if (ctx.state === 'suspended') ctx.resume();
  return ctx;
}
function freq(m){ return 440 * Math.pow(2, (m-69)/12); }
// トランスポーズ: キー決定後は C の鍵盤が「ド」になり、その調の高さで鳴る
function transposed(){ return mode === 'melody' && tonicPc != null; }
function shift(){ return transposed() ? (song && Number.isFinite(song.shift) ? song.shift : tonicPc) : 0; }
function soundMidi(m){ return m + shift(); }
function mkVoice(midi, when){
  const c = audio(); const f = freq(midi);
  const g = c.createGain(); g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(0.35, when + 0.012); g.connect(master);
  const o1 = c.createOscillator(); o1.type = 'triangle'; o1.frequency.value = f; o1.connect(g);
  const g2 = c.createGain(); g2.gain.value = 0.12; g2.connect(g);
  const o2 = c.createOscillator(); o2.type = 'sine'; o2.frequency.value = f*2; o2.connect(g2);
  o1.start(when); o2.start(when);
  const v = { g, oscs:[o1,o2], done:false };
  voices.add(v); return v;
}
function releaseVoice(v, at){
  if (v.done) return; v.done = true;
  const t = Math.max(at ?? ctx.currentTime, ctx.currentTime);
  v.g.gain.cancelScheduledValues(t);
  v.g.gain.setTargetAtTime(0, t, 0.045);
  v.oscs.forEach(o => { try { o.stop(t + 0.35); } catch(e){} });
  setTimeout(() => voices.delete(v), (t - ctx.currentTime)*1000 + 500);
}
function scheduleNote(midi, when, dur){
  const v = mkVoice(midi, when);
  v.g.gain.setValueAtTime(0.35, when + dur);
  v.g.gain.setTargetAtTime(0, when + dur, 0.045);
  v.oscs.forEach(o => o.stop(when + dur + 0.4));
  setTimeout(() => voices.delete(v), (when + dur + 0.5 - ctx.currentTime)*1000);
}
function stopAll(){
  playGen++; playing = false; updatePlayBtn();
  if (!ctx) return;
  const now = ctx.currentTime;
  for (const v of voices) { v.g.gain.cancelScheduledValues(now); v.g.gain.setTargetAtTime(0, now, 0.02); v.oscs.forEach(o => { try { o.stop(now + 0.1); } catch(e){} }); }
  voices.clear();
  piano.querySelectorAll('.lit').forEach(e => e.classList.remove('lit'));
}

// ---------- 鍵盤 ----------
function buildPiano(){
  piano.innerHTML = '';
  let wi = 0;
  for (let m = LOW; m <= HIGH; m++) {
    const pc = m % 12, black = BLACK.has(pc);
    const el = document.createElement('div');
    el.className = 'key ' + (black ? 'black' : 'white');
    el.dataset.midi = m;
    if (black) el.style.left = (wi*WHITE_W - BLACK_W/2) + 'px';
    else { el.style.left = (wi*WHITE_W) + 'px'; wi++; }
    el.innerHTML = '<span class="sub"></span><span class="lbl"></span>';
    piano.appendChild(el);
  }
  piano.style.width = (wi*WHITE_W) + 'px';
  relabel();
}
function degreeOf(m){ return m % 12; }   // 鍵盤は常に C＝ド の並び
function octOf(m){ return Math.floor(m / 12) - 5; }           // 60..71 → 0, 72..83 → 1, 48..59 → -1
function octMark(o){ return o > 0 ? UP.repeat(o) : o < 0 ? DOWN.repeat(-o) : ''; }
function solfOf(m){ return SOLF[m % 12] + octMark(octOf(m)); }
function labelFor(m){ return transposed() ? solfOf(m) : NOTE[m%12]; }
function relabel(){
  for (const el of piano.children) {
    const m = +el.dataset.midi, pc = m % 12;
    const lbl = el.querySelector('.lbl'), sub = el.querySelector('.sub');
    el.classList.remove('tonic');
    if (!transposed()) {
      lbl.textContent = BLACK.has(pc) ? '' : NOTE[pc] + (pc === 0 ? Math.floor(m/12)-1 : '');
      sub.textContent = '';
    } else {
      lbl.innerHTML = SOLF[pc] + (octOf(m) ? '<span class="oct"></span>' : '');
      if (octOf(m)) lbl.querySelector('.oct').textContent = octMark(octOf(m));
      sub.textContent = BLACK.has(pc) ? '' : NOTE[((pc + shift()) % 12 + 12) % 12];  // 実際に鳴る音
      if (pc === 0) el.classList.add('tonic');
    }
  }
}
function keyEl(m){ return piano.querySelector(`.key[data-midi="${m}"]`); }
function scrollToMidi(m, smooth){
  const el = keyEl(m); if (!el) return;
  pianoWrap.scrollTo({ left: el.offsetLeft, behavior: smooth ? 'smooth' : 'auto' });
}
function flashKey(m, dur){
  const el = keyEl(m); if (!el) return;
  el.classList.add('lit'); setTimeout(() => el.classList.remove('lit'), Math.max(80, dur*1000 - 40));
}

const active = new Map();
piano.addEventListener('pointerdown', e => {
  const el = e.target.closest('.key'); if (!el) return;
  e.preventDefault();
  audio();
  const midi = +el.dataset.midi;
  const v = mkVoice(soundMidi(midi), ctx.currentTime);
  el.classList.add('down');
  try { el.setPointerCapture(e.pointerId); } catch(err){}
  active.set(e.pointerId, { el, midi, v, startY: e.clientY, committed: false });
  showNow(labelFor(midi));
});
piano.addEventListener('pointermove', e => {
  const a = active.get(e.pointerId); if (!a || a.committed) return;
  if (e.clientY - a.startY > SWIPE_PX) { a.committed = true; a.el.classList.add('commit'); onSwipeDown(a.midi); }
});
function endPointer(e){
  const a = active.get(e.pointerId); if (!a) return;
  releaseVoice(a.v); a.el.classList.remove('down','commit'); active.delete(e.pointerId);
}
piano.addEventListener('pointerup', endPointer);
piano.addEventListener('pointercancel', endPointer);
piano.addEventListener('lostpointercapture', endPointer);
piano.addEventListener('contextmenu', e => e.preventDefault());

function onSwipeDown(midi){
  if (navigator.vibrate) navigator.vibrate(12);
  if (mode === 'key' || tonicPc == null) { setKey(midi); return; }
  insertText(solfOf(midi));
}

// ---------- キー ----------
function setKey(midi){
  const pc = midi % 12;
  tonicPc = pc; song.key = NOTE[pc]; song.shift = midi - 60; mode = 'melody';   // 見つけた音の高さがそのまま C4(ド) に来る
  relabel(); updateKeyUI(); persist();
  scrollToMidi(55, true);   // ソ(G3)から表示、ド(C4)が左寄りに来る
  showNow('ド＝' + NOTE[pc]);
}
function updateKeyUI(){
  if (tonicPc == null) { keyBtn.textContent = 'キー ?'; keyBtn.classList.add('unset'); }
  else { keyBtn.textContent = 'キー ' + NOTE[tonicPc]; keyBtn.classList.remove('unset'); }
  hintEl.classList.toggle('keymode', mode === 'key');
  if (mode === 'key') hintEl.textContent = '① 曲の終わりの音を想像して鍵盤で探す → 見つけたら、その鍵盤を下にスワイプ';
  else hintEl.textContent = `ド＝${NOTE[tonicPc]} に移調中。下にスワイプで追加。「キー」を上下にスワイプで半音ずつ移調。ド〜シは無印、上は↑、下は↓`;
}
keyBtn.addEventListener('click', e => {
  if (keyDrag.swiped) { keyDrag.swiped = false; e.preventDefault(); return; }   // スワイプ直後のクリックは無視
  if (mode === 'key' && tonicPc != null) mode = 'melody';
  else { mode = 'key'; showNow(''); }
  relabel(); updateKeyUI();
  scrollToMidi(mode === 'key' ? 60 : 55, true);
});

// キーのバッジを上下にスワイプ → 半音ずつカチカチ移調（上で高く、下で低く）
const TRANSPOSE_STEP_PX = 16, SHIFT_MIN = -24, SHIFT_MAX = 24;
const keyDrag = { id: null, startY: 0, startShift: 0, steps: 0, swiped: false };
function currentShift(){ return song && Number.isFinite(song.shift) ? song.shift : (tonicPc != null ? tonicPc : 0); }
function applyShift(sh){
  if (!song) return;
  sh = Math.max(SHIFT_MIN, Math.min(SHIFT_MAX, sh));
  song.shift = sh; tonicPc = ((sh % 12) + 12) % 12; song.key = NOTE[tonicPc]; mode = 'melody';
  relabel(); updateKeyUI(); persist();
}
function tick(midi){   // カチッという音 ＋ 新しいドを短く鳴らす
  const c = audio(), t = c.currentTime;
  const o = c.createOscillator(), g = c.createGain();
  o.type = 'square'; o.frequency.setValueAtTime(2400, t); o.frequency.exponentialRampToValueAtTime(600, t + 0.03);
  g.gain.setValueAtTime(0.18, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.035);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.05);
  scheduleNote(midi, t + 0.01, 0.13);
  if (navigator.vibrate) navigator.vibrate(6);
}
keyBtn.addEventListener('pointerdown', e => {
  if (!song) return;
  e.preventDefault();
  keyDrag.id = e.pointerId; keyDrag.startY = e.clientY; keyDrag.startShift = currentShift(); keyDrag.steps = 0; keyDrag.swiped = false;
  try { keyBtn.setPointerCapture(e.pointerId); } catch(err){}
});
keyBtn.addEventListener('pointermove', e => {
  if (e.pointerId !== keyDrag.id) return;
  const steps = Math.round((keyDrag.startY - e.clientY) / TRANSPOSE_STEP_PX);   // 上にスワイプで＋
  if (steps === keyDrag.steps) return;
  if (!keyDrag.swiped) { keyDrag.swiped = true; keyBtn.classList.add('drag'); }
  const before = currentShift();
  keyDrag.steps = steps;
  applyShift(keyDrag.startShift + steps);
  const sh = currentShift();
  if (sh !== before) {
    tick(60 + sh);
    keyBtn.classList.add('tick'); setTimeout(() => keyBtn.classList.remove('tick'), 80);
    showNow((sh > before ? '♯ ' : '♭ ') + 'ド＝' + NOTE[tonicPc]);
  }
});
function endKeyDrag(e){
  if (e.pointerId !== keyDrag.id) return;
  keyDrag.id = null; keyBtn.classList.remove('drag');
  if (keyDrag.swiped) scrollToMidi(55, true);
}
keyBtn.addEventListener('pointerup', endKeyDrag);
keyBtn.addEventListener('pointercancel', endKeyDrag);
keyBtn.addEventListener('contextmenu', e => e.preventDefault());

// ---------- 譜面(テキスト) ----------
function insertText(str){
  const s = ta.selectionStart ?? ta.value.length, e = ta.selectionEnd ?? s;
  ta.setRangeText(str, s, e, 'end');
  persist(); scrollCaret();
}
function backspace(){
  const s = ta.selectionStart, e = ta.selectionEnd;
  if (s !== e) ta.setRangeText('', s, e, 'end');
  else if (s > 0) {
    let i = s;
    while (i > 0 && (UP_CHARS.has(ta.value[i-1]) || DOWN_CHARS.has(ta.value[i-1]))) i--;   // 記号をまとめて
    if (i === s || i > 0) {
      const p = ta.value[i-1];
      if ((p === 'ァ' || p === 'ィ') && ta.value[i-2] === 'フ') i -= 2;
      else if (i > 0) i -= 1;
    }
    ta.setRangeText('', i, s, 'end');
  }
  persist();
}
function scrollCaret(){
  // 末尾付近に入力しているときは追従
  if (ta.selectionEnd >= ta.value.length - 2) ta.scrollTop = ta.scrollHeight;
}
let nowTimer = 0;
function showNow(s){
  nowEl.textContent = s; nowEl.classList.add('show');
  clearTimeout(nowTimer); nowTimer = setTimeout(() => nowEl.classList.remove('show'), 900);
}
function tokenize(text){
  const out = [];
  const note = (deg, ch) => out.push({ type:'note', deg, oct:0, ch });
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (c === 'フ') {
      const n = text[i+1];
      if (n === 'ァ' || n === 'ア') { note(5, 'ファ'); i++; }
      else if (n === 'ィ' || n === 'イ') { note(6, 'フィ'); i++; }
      continue;
    }
    const d = SOLF.indexOf(c);
    if (d >= 0) { note(d, c); continue; }
    if (UP_CHARS.has(c) || DOWN_CHARS.has(c)) {   // 直前の音のオクターブ記号
      const last = out[out.length-1];
      if (last && last.type === 'note') { last.oct += UP_CHARS.has(c) ? 1 : -1; last.ch += UP_CHARS.has(c) ? UP : DOWN; }
      continue;
    }
    if (c === 'ー' || c === '〜' || c === '~' || c === '-' || c === '－') { out.push({ type:'hold' }); continue; }
    if (c === '\n') { out.push({ type:'rest', len:1.5 }); continue; }
    if (c === ' ' || c === '　' || c === '、' || c === ',' || c === '/' || c === '|' || c === '・' || c === '。') { out.push({ type:'rest', len:1 }); continue; }
  }
  return out;
}
function playAll(){
  stopAll();
  const toks = tokenize(ta.value);
  if (!toks.length) { showNow('…'); return; }
  const c = audio();
  const tb = 60;   // 譜面は C＝ド で組み立て、鳴らすときに移調する
  let t = c.currentTime + 0.06;
  const events = [];
  for (const tk of toks) {
    if (tk.type === 'hold') { if (events.length) events[events.length-1].dur += BEAT; t += BEAT; continue; }
    if (tk.type === 'rest') { t += BEAT * tk.len; continue; }
    const midi = tb + tk.deg + 12 * Math.max(-1, Math.min(2, tk.oct));   // 無印＝基準のオクターブ、↑↓で上下
    events.push({ midi, when: t, dur: BEAT * 0.9, ch: tk.ch });
    t += BEAT;
  }
  playing = true; updatePlayBtn();
  const gen = ++playGen;
  for (const ev of events) {
    scheduleNote(soundMidi(ev.midi), ev.when, ev.dur);
    setTimeout(() => { if (gen !== playGen) return; showNow(ev.ch); flashKey(ev.midi, ev.dur); }, (ev.when - c.currentTime) * 1000);
  }
  setTimeout(() => { if (gen === playGen) { playing = false; updatePlayBtn(); } }, (t - c.currentTime) * 1000 + 200);
}
function updatePlayBtn(){ $('btn-play').textContent = playing ? '♪ 再生中' : '▶ 再生'; }

// 演奏系ボタンは押した瞬間に反応（連打しても取りこぼさない）。click は使わない
function onPress(id, fn){
  const el = $(id);
  el.addEventListener('pointerdown', e => { e.preventDefault(); if (e.button === 0 || e.pointerType !== 'mouse') fn(); });
  el.addEventListener('click', e => e.preventDefault());
}
onPress('btn-play', playAll);
onPress('btn-stop', stopAll);
onPress('btn-space', () => insertText(' '));
onPress('btn-newline', () => insertText('\n'));
onPress('btn-bs', backspace);
$('btn-kbd').addEventListener('click', () => {
  const on = ta.getAttribute('inputmode') === 'none';
  ta.setAttribute('inputmode', on ? 'text' : 'none');
  $('btn-kbd').classList.toggle('on', on);
  if (on) { ta.focus(); } else { ta.blur(); }
});
ta.addEventListener('input', persist);
titleEl.addEventListener('input', persist);
titleEl.addEventListener('keydown', e => { if (e.key === 'Enter') titleEl.blur(); });

// ---------- 保存 ----------
function persist(){
  if (!song) return;
  song.title = titleEl.value; song.text = ta.value; song.updated = Date.now();
  save(LS_SONGS, songs);
}
function openSong(s){
  stopAll();
  song = s; tonicPc = s.key ? NOTE.indexOf(s.key) : null; if (tonicPc < 0) tonicPc = null;
  mode = tonicPc == null ? 'key' : 'melody';
  titleEl.value = s.title || ''; ta.value = s.text || '';
  ta.setAttribute('inputmode','none'); $('btn-kbd').classList.remove('on');
  relabel(); updateKeyUI();
  screenList.classList.add('hidden'); screenEdit.classList.remove('hidden');
  scrollToMidi(tonicPc == null ? 60 : 55, false);
  save(LS_LAST, s.id);
  if (!s.title) titleEl.focus();
}
function newSong(){
  const s = { id: uid(), title:'', key:null, text:'', updated: Date.now() };
  songs.unshift(s); save(LS_SONGS, songs); openSong(s);
}
function backToList(){
  stopAll(); persist();
  // 空っぽの曲は捨てる
  if (song && !song.title && !song.text && !song.key) songs = songs.filter(x => x !== song);
  save(LS_SONGS, songs); song = null; save(LS_LAST, null);
  renderList();
  screenEdit.classList.add('hidden'); screenList.classList.remove('hidden');
}
function renderList(){
  const list = $('song-list'); list.innerHTML = '';
  if (!songs.length) { list.innerHTML = '<div class="empty">まだ曲がありません。<br>「＋ 新しい曲」から耳コピを始めましょう。</div>'; return; }
  const sorted = [...songs].sort((a,b) => (b.updated||0) - (a.updated||0));
  for (const s of sorted) {
    const el = document.createElement('div'); el.className = 'item';
    const first = (s.text||'').split('\n').find(l => l.trim()) || '';
    el.innerHTML = `<div class="body"><div class="t"></div><div class="p"></div></div><div class="k"></div>`;
    el.querySelector('.t').textContent = s.title || '無題';
    el.querySelector('.p').textContent = first || '（まだ音がありません）';
    el.querySelector('.k').textContent = s.key ? 'ド＝' + s.key : '';
    el.addEventListener('click', () => openSong(s));
    list.appendChild(el);
  }
}
$('btn-new').addEventListener('click', newSong);
$('btn-back').addEventListener('click', backToList);

// ---------- テキスト入出力 ----------
function songToText(s){
  return [s.title || '無題', 'キー: ' + (s.key || '?'), (s.text || '').replace(/\s+$/,'')].join('\n');
}
const KEY_RE = /^(?:キー|key)?\s*[:：]?\s*([A-Ga-g])\s*([#♯]|[b♭])?\s*$/;
function parseKey(line){
  const m = KEY_RE.exec(line.trim()); if (!m) return undefined;
  let pc = NOTE.indexOf(m[1].toUpperCase());
  if (m[2] === '#' || m[2] === '♯') pc = (pc + 1) % 12;
  if (m[2] === 'b' || m[2] === '♭') pc = (pc + 11) % 12;
  return NOTE[pc];
}
function parseText(text){
  const blocks = text.replace(/\r/g,'').split(/\n\s*-{3,}\s*\n/);
  const out = [];
  for (const b of blocks) {
    const lines = b.replace(/^\s*\n+/, '').split('\n');
    if (!lines.join('').trim()) continue;
    const title = lines.shift().trim();
    let key = null;
    if (lines.length) {
      const l0 = lines[0].trim();
      if (/^(キー|key)\s*[:：]?\s*\?$/i.test(l0)) { lines.shift(); }
      else { const k = parseKey(l0); if (k) { key = k; lines.shift(); } }
    }
    out.push({ id: uid(), title, key, text: lines.join('\n').replace(/^\n+|\s+$/g,''), updated: Date.now() });
  }
  return out;
}
function showTextDialog({ title, desc, text, readonly, onOk }){
  $('dlg-title').textContent = title; $('dlg-desc').textContent = desc || '';
  const dta = $('dlg-ta'); dta.value = text || ''; dta.readOnly = !!readonly;
  $('dlg-ok').classList.toggle('hidden', !onOk);
  $('dlg-copy').classList.toggle('hidden', !readonly);
  $('dlg-ok').onclick = () => { onOk && onOk(dta.value); $('dlg-text').close(); };
  $('dlg-text').showModal();
  if (!readonly) dta.focus();
}
$('dlg-cancel').addEventListener('click', () => $('dlg-text').close());
$('dlg-copy').addEventListener('click', () => copyText($('dlg-ta').value));
async function copyText(s){
  try { await navigator.clipboard.writeText(s); toast('コピーしました'); }
  catch(e){ $('dlg-ta').select(); toast('選択してコピーしてください'); }
}
$('btn-export-all').addEventListener('click', () => {
  showTextDialog({ title:'図鑑を書き出し', desc:'曲ごとに「---」で区切っています。メモ帳などに貼って保存できます。', readonly:true,
    text: songs.map(songToText).join('\n\n---\n\n') });
});
$('btn-import').addEventListener('click', () => {
  showTextDialog({ title:'テキストから取り込み', desc:'1行目タイトル、2行目キー（例: キー: G）、3行目以降ドレミ。複数曲は「---」で区切り。', readonly:false,
    onOk: v => { const add = parseText(v); songs.unshift(...add); save(LS_SONGS, songs); renderList(); toast(add.length + '曲 取り込みました'); } });
});

// メニュー
$('btn-menu').addEventListener('click', () => $('dlg-menu').showModal());
$('m-close').addEventListener('click', () => $('dlg-menu').close());
$('m-export').addEventListener('click', () => { $('dlg-menu').close(); persist(); showTextDialog({ title:'この曲を書き出し', readonly:true, text: songToText(song) }); });
$('m-share').addEventListener('click', () => { $('dlg-menu').close(); persist(); copyText(shareUrl(song)); });
$('m-delete').addEventListener('click', () => {
  if (!confirm(`「${song.title || '無題'}」を削除しますか？`)) return;
  $('dlg-menu').close(); songs = songs.filter(x => x !== song); song = null; save(LS_SONGS, songs); backToList();
});

// 共有リンク
function b64e(s){ return btoa(String.fromCharCode(...new TextEncoder().encode(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function b64d(s){ s = s.replace(/-/g,'+').replace(/_/g,'/'); return new TextDecoder().decode(Uint8Array.from(atob(s), c => c.charCodeAt(0))); }
function shareUrl(s){ return location.origin + location.pathname + '#s=' + b64e(JSON.stringify({ t:s.title, k:s.key, m:s.text })); }
function importFromHash(){
  const m = /[#&]s=([^&]+)/.exec(location.hash); if (!m) return false;
  try {
    const o = JSON.parse(b64d(m[1]));
    history.replaceState(null, '', location.pathname);
    const dup = songs.find(x => x.title === o.t && x.key === o.k && x.text === o.m);
    const s = dup || { id: uid(), title: o.t || '', key: o.k || null, text: o.m || '', updated: Date.now() };
    if (!dup) { songs.unshift(s); save(LS_SONGS, songs); toast('共有された曲を図鑑に追加しました'); }
    openSong(s); return true;
  } catch(e){ return false; }
}

let toastTimer = 0;
function toast(s){ const t = $('toast'); t.textContent = s; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1800); }

// ---------- ズーム防止（iOS Safari は user-scalable=no を無視するので JS で止める） ----------
let lastTouchEnd = 0;
document.addEventListener('touchend', e => {
  const t = e.target;
  if (t.closest && (t.closest('dialog') || t === titleEl)) return;   // 文字入力欄はそのまま
  const now = Date.now();
  if (now - lastTouchEnd < 350) e.preventDefault();   // ダブルタップ拡大を抑止
  lastTouchEnd = now;
}, { passive: false });
document.addEventListener('touchmove', e => { if (e.touches.length > 1 && !e.target.closest('dialog')) e.preventDefault(); }, { passive: false });   // ピンチ拡大を抑止
document.addEventListener('gesturestart', e => e.preventDefault(), { passive: false });
document.addEventListener('dblclick', e => { if (!e.target.closest('dialog') && e.target !== titleEl) e.preventDefault(); });

// ---------- 起動 ----------
buildPiano();
renderList();
if (!importFromHash()) {
  const last = load(LS_LAST, null);
  const s = last && songs.find(x => x.id === last);
  if (s) openSong(s);
}
window.addEventListener('resize', () => { /* 高さ変化時も鍵盤の位置を保つ */ });
</script>
</body>
